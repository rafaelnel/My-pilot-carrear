name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Normalize package versions for public npm
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const fixes = {
              "vite": "^6.2.0",
              "@vitejs/plugin-react": "^4.3.4",
              "@tailwindcss/vite": "^4.0.9",
              "tailwindcss": "^4.0.9",
              "typescript": "~5.8.2",
              "@types/react": "^19.0.10",
              "@types/react-dom": "^19.0.4",
              "@google/genai": "^1.0.0"
            };
            for (const [k, v] of Object.entries(fixes)) {
              if (pkg.dependencies && pkg.dependencies[k]) pkg.dependencies[k] = v;
              if (pkg.devDependencies && pkg.devDependencies[k]) pkg.devDependencies[k] = v;
            }
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

