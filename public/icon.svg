<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14141C" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>
    <linearGradient id="helmetShell" x1="96" y1="96" x2="416" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2800" />
      <stop offset="55%" stop-color="#DC143C" />
      <stop offset="100%" stop-color="#8B0000" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="200" y1="190" x2="430" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="visorGlare" x1="220" y1="205" x2="400" y2="265" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#E6FF55" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="neonAccent" x1="80" y1="140" x2="400" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E6FF55" />
      <stop offset="100%" stop-color="#A3E635" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" stroke="#E6FF55" stroke-opacity="0.28" stroke-width="6" />

  <!-- Subtle Racing Telemetry Ring -->
  <circle cx="256" cy="256" r="196" stroke="#E6FF55" stroke-opacity="0.12" stroke-width="4" stroke-dasharray="18 10" />

  <!-- Helmet Group Centered -->
  <g transform="translate(48, 44) scale(6.5)">
    <!-- Rear aerodynamic spoiler fin -->
    <path d="M6 26L14 16L16 32L8 34Z" fill="#991B1B" />

    <!-- Main F1 Helmet Shell -->
    <path d="M10 34C10 17.5 22.5 8 37 8C48.5 8 56 15.5 57.5 24.5L32 25.5L30 37L57.5 36.5C57 44.5 52.5 51 44 53L18 53C13 51 10 43.5 10 34Z" fill="url(#helmetShell)" stroke="#F8FAFC" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Racing Neon & White Aerodynamic Stripes -->
    <path d="M14 22C21 15 32 12 48 14.5L52 18.5C35 16.5 23 19 12 27.5Z" fill="url(#neonAccent)" />
    <path d="M12 43L40 43L46 47L14 47Z" fill="#F8FAFC" fill-opacity="0.92" />

    <!-- Carbon Fiber Chin Diffuser / Base -->
    <path d="M16 50H47C44.5 53.5 40.5 55 34 55H21C18 55 16.5 52.5 16 50Z" fill="#18181B" stroke="#3F3F46" stroke-width="1" />

    <!-- Visor Opening & Dark Tinted Visor -->
    <path d="M29 23.5L57.5 23C59 27.5 59 33 57.5 37.5L28.5 38C25.5 36 25.5 26 29 23.5Z" fill="url(#visorGrad)" stroke="#E2E8F0" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Iridescent Visor Tear-off Reflection -->
    <path d="M31 26.5L55.5 26C56 28.5 56 30.5 55.5 32L30.5 32.5C29 30.5 29.5 28 31 26.5Z" fill="url(#visorGlare)" />

    <!-- Visor Top Strip (Zylon Banner) -->
    <path d="M29.5 23.5L57.2 23L57.8 25.8L28.5 26.5Z" fill="#E6FF55" />

    <!-- Visor Pivot Screw / Hinge -->
    <circle cx="29.5" cy="31" r="3" fill="#E2E8F0" stroke="#0F172A" stroke-width="1.5" />
    <circle cx="29.5" cy="31" r="1" fill="#EF4444" />
  </g>
</svg>
